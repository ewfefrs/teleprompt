name: Whisprompt
options:
  bundleIdPrefix: com.whisprompt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Whisprompt:
    type: application
    platform: iOS
    sources:
      - path: Whisprompt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whisprompt.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Whisprompt/Info.plist
    info:
      path: Whisprompt/Info.plist
      properties:
        CFBundleDisplayName: Whisprompt
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: "Whisprompt connects to your Even G2 glasses over Bluetooth to display your scripts."
        NSBluetoothPeripheralUsageDescription: "Whisprompt connects to your Even G2 glasses over Bluetooth to display your scripts."
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
schemes:
  Whisprompt:
    build:
      targets:
        Whisprompt: all
    run:
      config: Debug
    archive:
      config: Release

# JVM-аргументы для сборки.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Включаем AndroidX (обязательно для современных androidx-зависимостей).
android.useAndroidX=true

# Нетранзитивный R-класс — быстрее сборка, меньше шанс конфликтов ресурсов.
android.nonTransitiveRClass=true

# Официальный стиль кода Kotlin.
kotlin.code.style=official

# Параллельная и кэширующая сборка.
org.gradle.parallel=true
org.gradle.caching=true
